<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Securelytics Bank · Pay</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2366b39a'/%3E%3Crect x='6' y='10' width='20' height='13' rx='3' fill='%23fff'/%3E%3Crect x='6' y='13' width='20' height='3' fill='%2366b39a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/pay.css">
  <script>
    (function () {
      var t = localStorage.getItem("sl-theme");
      if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body class="pay-body">
  <header class="pay-top">
    <div class="brand">
      <div class="brand-logo neu pay-logo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"/><rect x="3" y="9" width="18" height="3" class="band"/></svg></div>
      <div><div class="brand-name">Securelytics Bank</div><div class="brand-sub">Card payments</div></div>
    </div>
    <div class="pay-top-actions">
      <button class="btn small hidden" id="switch-card">Switch card</button>
      <div class="theme-switch neu-inset" role="group" aria-label="Theme">
        <button data-theme-set="light">Light</button><button data-theme-set="dark">Dark</button>
      </div>
    </div>
  </header>

  <main class="pay-main" id="pay-view" tabindex="-1"></main>

  <footer class="pay-foot muted small">
    Payment simulator for the Securelytics fraud-detection demo. Cardholders are synthetic (Sparkov dataset).
    Payments go through the same Kafka pipeline as real swipes. <a href="/" target="_blank" rel="noopener">Open admin dashboard ↗</a>
  </footer>

  <div class="modal hidden" id="receipt-modal" role="dialog" aria-modal="true" aria-labelledby="receipt-title">
    <div class="modal-card neu receipt" id="receipt"></div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/static/js/pay.js"></script>
</body>
</html>
