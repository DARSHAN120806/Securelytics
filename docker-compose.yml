name: securelytics

x-app: &app
  build: .
  image: securelytics-app
  env_file:
    - path: .env
      required: false
  environment:
    KAFKA_BOOTSTRAP: kafka:19092
    REDIS_URL: redis://redis:6379/0
    POSTGRES_DSN: postgresql://${POSTGRES_USER:-fraud}:${POSTGRES_PASSWORD:-fraud}@postgres:5432/securelytics
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    SHADOW_SCORING: ${SHADOW_SCORING:-true}
  volumes:
    - ./models:/app/models:ro
    - ./reports:/app/reports:ro
    - ./data/raw:/app/data/raw:ro

services:
  # ---------------- infrastructure ----------------
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "for t in transactions:3 fraud-alerts:1 transactions-dlq:1; do
         /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
           --topic $${t%%:*} --partitions $${t##*:} --replication-factor 1;
       done"

  kafka-ui:
    image: kafbat/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: securelytics
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud}
      POSTGRES_DB: securelytics
    volumes:
      - ./storage/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d securelytics"]
      interval: 5s
      retries: 10

  # ---------------- application ----------------
  processor:
    <<: *app
    command: python services/processor.py
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  producer:
    <<: *app
    command: python services/producer.py --rate ${EVENTS_PER_SEC:-50} --inject-attacks ${ATTACK_EVERY_SEC:-60}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      processor: { condition: service_started }

  api:
    <<: *app
    command: uvicorn services.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  dashboard:
    <<: *app
    command: streamlit run services/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    depends_on:
      postgres: { condition: service_healthy }

  # ---------------- one-off jobs ----------------
  # Train / retrain all four models:  docker compose run --rm trainer
  trainer:
    <<: *app
    profiles: ["tools"]
    command: sh -c "python -m securelytics.prepare && python -m securelytics.train && python -m securelytics.eda"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports

  # Run the test suite inside the image:  docker compose run --rm tests
  tests:
    <<: *app
    profiles: ["tools"]
    command: python -m pytest -q
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./tests:/app/tests:ro

volumes:
  pgdata:
